name: Deploy to Cloudflare

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - run: npm run build

      - name: Verify build output
        run: |
          echo "=== .output/server ==="
          ls -la .output/server/ || echo "MISSING"
          echo "=== .output/public ==="
          ls -la .output/public/ || echo "MISSING"

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          rm -rf .wrangler
          echo "=== .output/server contents ==="
          ls -la .output/server/ || true
          echo "=== choosing deploy target ==="
          if [ -f .output/server/wrangler.json ]; then
            echo "Using Nitro-generated wrangler config from .output/server"
            cd .output/server && bunx wrangler@latest deploy --experimental-autoconfig=false
          elif [ -f .output/server/index.mjs ] && [ -d .output/public ]; then
            echo "Using .output/server/index.mjs + .output/public assets"
            bunx wrangler@latest deploy .output/server/index.mjs --name tanstack-start-ts --assets .output/public --compatibility-date 2026-06-03 --compatibility-flag nodejs_compat --no-bundle --experimental-autoconfig=false
          else
            echo "No supported Cloudflare deploy output found"
            echo "=== .output ==="
            ls -la .output/ || true
            echo "=== .output/server ==="
            ls -la .output/server/ || true
            echo "=== .output/public ==="
            ls -la .output/public/ || true
            exit 1
          fi
