name: Deploy to Cloudflare

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - run: bun run build

      - name: Verify build output
        run: |
          echo "=== dist ==="
          ls -la dist/ || echo "MISSING"
          echo "=== dist/server ==="
          ls -la dist/server/ || echo "MISSING"
          echo "=== dist/client ==="
          ls -la dist/client/ || echo "MISSING"
          echo "=== .output ==="
          ls -la .output/ 2>/dev/null || echo "no .output"
          echo "=== dist tree ==="
          find dist -maxdepth 3 -type f 2>/dev/null | sort || true
          echo "=== .output tree ==="
          find .output -maxdepth 3 -type f 2>/dev/null | sort || true
          echo "=== .wrangler tree ==="
          find .wrangler -maxdepth 4 -type f 2>/dev/null | sort || true

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: tanstack-start-ts
        run: |
          # Force a short, valid worker name. Cloudflare rejects names >63 chars
          # or with invalid characters; Nitro's auto-generated name on CI can
          # exceed that limit when derived from the repo name.
          if [ -f dist/server/wrangler.json ]; then
            node -e "const f='dist/server/wrangler.json';const j=JSON.parse(require('fs').readFileSync(f,'utf8'));j.name=process.env.WORKER_NAME;require('fs').writeFileSync(f,JSON.stringify(j,null,2));console.log('patched worker name ->',j.name);"
          fi

          if [ -f dist/server/wrangler.json ]; then
            echo "=== Deploying with generated config dist/server/wrangler.json ==="
            cat dist/server/wrangler.json
            bunx wrangler@latest deploy --config dist/server/wrangler.json --name "$WORKER_NAME"
            exit 0
          fi

          if [ -f dist/server/wrangler.jsonc ]; then
            echo "=== Deploying with generated config dist/server/wrangler.jsonc ==="
            cat dist/server/wrangler.jsonc
            bunx wrangler@latest deploy --config dist/server/wrangler.jsonc --name "$WORKER_NAME"
            exit 0
          fi

          if [ -f dist/nitro.json ]; then
            echo "=== Deploying with nitro --prebuilt ==="
            bunx nitro deploy --prebuilt
            exit 0
          fi

          if [ -d .output ]; then
            echo "=== Deploying with nitro --prebuilt from .output ==="
            bunx nitro deploy --prebuilt
            exit 0
          fi

          if [ -f dist/server/index.mjs ] && [ -d dist/client ]; then
            echo "=== Falling back to direct worker deploy ==="
            bunx wrangler@latest deploy dist/server/index.mjs --assets dist/client --name "$WORKER_NAME"
            exit 0
          fi

          echo "::error::No deployable Cloudflare worker output was found"
          ls -la dist dist/server dist/client .output 2>&1 || true
          exit 1
