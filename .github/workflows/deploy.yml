name: Deploy to Cloudflare

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - run: npm run build

      - name: Verify build output
        run: |
          echo "=== dist/server ==="
          ls -la dist/server/ || echo "MISSING"
          echo "=== dist/client ==="
          ls -la dist/client/ || echo "MISSING"

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          rm -rf .wrangler
          echo "=== dist/server contents ==="
          ls -la dist/server/ || true
          echo "=== choosing deploy target ==="
          if [ -f dist/server/wrangler.json ]; then
            echo "Using Nitro-generated wrangler config from dist/server"
            cd dist/server && bunx wrangler@latest deploy
          elif [ -f dist/server/index.mjs ] && [ -d dist/client ]; then
            echo "Using dist/server/index.mjs + dist/client assets"
            bunx wrangler@latest deploy dist/server/index.mjs --name tanstack-start-ts --assets dist/client --compatibility-date 2026-06-03 --compatibility-flag nodejs_compat --no-bundle
          else
            echo "No supported Cloudflare deploy output found"
            echo "=== dist ==="
            ls -la dist/ || true
            echo "=== dist/server ==="
            ls -la dist/server/ || true
            echo "=== dist/client ==="
            ls -la dist/client/ || true
            exit 1
          fi
