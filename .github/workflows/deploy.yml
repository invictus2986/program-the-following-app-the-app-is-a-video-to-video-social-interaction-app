name: Deploy to Cloudflare

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}

      - name: Verify build output
        run: |
          echo "=== .output/public ==="
          ls -la .output/public 2>/dev/null || echo "MISSING"
          echo "=== .output/public/_worker.js ==="
          ls -la .output/public/_worker.js 2>/dev/null || echo "MISSING"
          echo "=== .output/public tree ==="
          find .output/public -maxdepth 3 -type f 2>/dev/null | sort || true
          echo "=== .wrangler tree ==="
          find .wrangler -maxdepth 4 -type f 2>/dev/null | sort || true

      - name: Verify Supabase project baked into bundle
        run: |
          OLD_REF="ahamqopyceizmfuslhnz"
          NEW_REF="mgmrcwslvoovtafzditt"

          if grep -rl "$OLD_REF" .output/public > /tmp/old-refs.txt 2>/dev/null && [ -s /tmp/old-refs.txt ]; then
            echo "::error::Old Supabase project ref ($OLD_REF) found in the production bundle:"
            cat /tmp/old-refs.txt
            exit 1
          fi
          echo "OK: no reference to the old Supabase project."

          if grep -rl "$NEW_REF" .output/public > /tmp/new-refs.txt 2>/dev/null && [ -s /tmp/new-refs.txt ]; then
            echo "OK: new Supabase project ref ($NEW_REF) present in:"
            cat /tmp/new-refs.txt
          else
            echo "::error::New Supabase project ref ($NEW_REF) is missing from the production bundle. Check the VITE_SUPABASE_* repository variables."
            exit 1
          fi

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Cloudflare Pages deployment: the wrangler.jsonc at the project root
          # already points to pages_build_output_dir=".output/public".
          if [ -d .output/public/_worker.js ]; then
            echo "=== Deploying to Cloudflare Pages from .output/public ==="
            bunx wrangler@latest pages deploy
            exit 0
          fi

          echo "::error::No deployable Cloudflare Pages output was found at .output/public/_worker.js"
          ls -la .output/public 2>&1 || true
          exit 1
