name: Deploy to Cloudflare

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - run: bun run build

      - name: Verify build output
        run: |
          echo "=== .output/public ==="
          ls -la .output/public 2>/dev/null || echo "MISSING"
          echo "=== .output/public/_worker.js ==="
          ls -la .output/public/_worker.js 2>/dev/null || echo "MISSING"
          echo "=== .output/public tree ==="
          find .output/public -maxdepth 3 -type f 2>/dev/null | sort || true
          echo "=== .wrangler tree ==="
          find .wrangler -maxdepth 4 -type f 2>/dev/null | sort || true

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Cloudflare Pages deployment: the wrangler.jsonc at the project root
          # already points to pages_build_output_dir=".output/public".
          if [ -d .output/public/_worker.js ]; then
            echo "=== Deploying to Cloudflare Pages from .output/public ==="
            bunx wrangler@latest pages deploy
            exit 0
          fi

          echo "::error::No deployable Cloudflare Pages output was found at .output/public/_worker.js"
          ls -la .output/public 2>&1 || true
          exit 1
