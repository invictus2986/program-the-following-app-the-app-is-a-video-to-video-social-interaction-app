name: Deploy to Cloudflare

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - run: bun run build

      - name: List build output
        run: |
          echo "=== dist/server ==="
          ls -la dist/server/ 2>/dev/null || echo "NOT FOUND"
          echo "=== dist/client ==="
          ls -la dist/client/ 2>/dev/null || echo "NOT FOUND"
          echo "=== wrangler.json in dist/server ==="
          cat dist/server/wrangler.json 2>/dev/null || echo "NOT FOUND"

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config dist/server/wrangler.json
