name: Deploy to Cloudflare

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - run: npm run build

      - name: Verify build output
        run: |
          echo "=== dist/server ==="
          ls -la dist/server/ || echo "MISSING"
          echo "=== dist/client ==="
          ls -la dist/client/ || echo "MISSING"

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          rm -rf .wrangler
          if [ ! -f dist/server/wrangler.json ]; then
            echo "::error::Missing dist/server/wrangler.json — build did not produce a Nitro Cloudflare bundle"
            ls -la dist/ dist/server/ dist/client/ || true
            exit 1
          fi
          echo "=== Deploying with config: ==="
          cat dist/server/wrangler.json
          cd dist/server && bunx wrangler@latest deploy
